<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogo da velha</title>
<style>
  :root {
    /* Catppuccin Mocha */
    --bg: #1e1e2e;
    --bg-deep: #11111b;
    --cell: #313244;
    --cell-hover: #45475a;
    --line: #cba6f7;
    --text: #cdd6f4;
    --muted: #a6adc8;
    --x: #89b4fa;
    --o: #fab387;
    --win: #a6e3a1;
    --win-text: #11111b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { color-scheme: light dark; }
  /* Catppuccin Latte */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eff1f5;
      --bg-deep: #dce0e8;
      --cell: #ccd0da;
      --cell-hover: #bcc0cc;
      --line: #8839ef;
      --text: #4c4f69;
      --muted: #6c6f85;
      --x: #1e66f5;
      --o: #fe640b;
      --win: #40a02b;
      --win-text: #eff1f5;
    }
  }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 30% 20%, var(--bg), var(--bg-deep));
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: min(420px, 100%); text-align: center; }
  h1 { font-size: 2rem; margin: 0 0 4px; font-weight: 800; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }

  .placar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .placar div { background: var(--bg-deep); border: 2px solid transparent; border-radius: 10px; padding: 8px 4px; }
  .placar div.vez { border-color: var(--line); }
  .placar span { display: block; font-size: .8rem; color: var(--muted); }
  .placar strong { font-size: 1.5rem; }

  #status { min-height: 1.6em; font-size: 1.15rem; font-weight: 600; margin-bottom: 14px; }

  #tabuleiro {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 8px;
    background: var(--line);
    border-radius: 14px;
  }
  .celula {
    aspect-ratio: 1;
    background: var(--cell);
    border: 0;
    border-radius: 8px;
    font-size: clamp(2.5rem, 14vw, 4rem);
    font-weight: 800;
    cursor: pointer;
    color: var(--text);
    position: relative;
  }
  .celula:hover:not(:disabled) { background: var(--cell-hover); }
  .celula:focus-visible { outline: 3px solid var(--text); outline-offset: -6px; }
  .celula:disabled { cursor: default; }
  .celula.X { color: var(--x); }
  .celula.O { color: var(--o); }
  .celula .dica {
    position: absolute; top: 4px; left: 7px;
    font-size: .7rem; font-weight: 400; color: var(--muted); opacity: .7;
  }
  .celula.venceu { background: var(--win); }
  .celula.venceu.X, .celula.venceu.O { color: var(--win-text); }

  button.novo {
    margin-top: 20px;
    background: var(--line);
    color: var(--bg-deep);
    border: 0;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button.novo:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .ajuda { color: var(--muted); font-size: .85rem; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>Jogo da velha</h1>
  <p class="sub">Dois jogadores, no mesmo teclado.</p>

  <div class="placar" aria-label="Placar">
    <div id="pX"><span>Jogador X</span><strong id="sX">0</strong></div>
    <div><span>Empates</span><strong id="sE">0</strong></div>
    <div id="pO"><span>Jogador O</span><strong id="sO">0</strong></div>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="tabuleiro" role="grid" aria-label="Tabuleiro"></div>

  <button class="novo" id="novo">Nova partida</button>
  <p class="ajuda">Clique nas casas ou use as teclas 1 a 9 (como no teclado numérico). Tecla R reinicia.</p>
</main>

<script>
  const COMBINACOES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  // Teclas 1–9 seguem o layout do teclado numérico: 7 8 9 em cima, 1 2 3 embaixo
  const TECLA_PARA_CASA = { '7':0,'8':1,'9':2,'4':3,'5':4,'6':5,'1':6,'2':7,'3':8 };
  const CASA_PARA_TECLA = ['7','8','9','4','5','6','1','2','3'];

  const tabuleiroEl = document.getElementById('tabuleiro');
  const statusEl = document.getElementById('status');
  const placar = { X: 0, O: 0, E: 0 };

  let casas, jogador, fim, primeiro = 'X';
  const botoes = [];

  for (let i = 0; i < 9; i++) {
    const b = document.createElement('button');
    b.className = 'celula';
    b.setAttribute('role', 'gridcell');
    b.setAttribute('aria-label', 'Casa ' + CASA_PARA_TECLA[i]);
    b.addEventListener('click', () => jogar(i));
    tabuleiroEl.appendChild(b);
    botoes.push(b);
  }

  function iniciar() {
    casas = Array(9).fill('');
    fim = false;
    jogador = primeiro;
    botoes.forEach((b, i) => {
      b.className = 'celula';
      b.disabled = false;
      b.innerHTML = '<span class="dica">' + CASA_PARA_TECLA[i] + '</span>';
    });
    atualizarStatus();
  }

  function atualizarStatus(msg) {
    statusEl.textContent = msg || 'Vez do jogador ' + jogador;
    document.getElementById('pX').classList.toggle('vez', !fim && jogador === 'X');
    document.getElementById('pO').classList.toggle('vez', !fim && jogador === 'O');
  }

  function jogar(i) {
    if (fim || casas[i]) return;
    casas[i] = jogador;
    botoes[i].textContent = jogador;
    botoes[i].classList.add(jogador);
    botoes[i].disabled = true;

    const combo = COMBINACOES.find(c => c.every(k => casas[k] === jogador));
    if (combo) {
      fim = true;
      combo.forEach(k => botoes[k].classList.add('venceu'));
      placar[jogador]++;
      document.getElementById('s' + jogador).textContent = placar[jogador];
      botoes.forEach(b => b.disabled = true);
      atualizarStatus('O jogador ' + jogador + ' venceu!');
      primeiro = jogador === 'X' ? 'O' : 'X';
      return;
    }
    if (casas.every(Boolean)) {
      fim = true;
      placar.E++;
      document.getElementById('sE').textContent = placar.E;
      atualizarStatus('Deu velha! Empate.');
      primeiro = primeiro === 'X' ? 'O' : 'X';
      return;
    }
    jogador = jogador === 'X' ? 'O' : 'X';
    atualizarStatus();
  }

  document.addEventListener('keydown', e => {
    if (e.key in TECLA_PARA_CASA) jogar(TECLA_PARA_CASA[e.key]);
    else if (e.key.toLowerCase() === 'r') iniciar();
  });
  document.getElementById('novo').addEventListener('click', iniciar);

  iniciar();
</script>
</body>
</html>
